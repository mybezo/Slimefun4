name: Build Slimefun4

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean build -x spotlessJavaCheck -x spotlessCheck --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Slimefun4-Build
          path: build/libs/*.jar
