#########################################################################
# Database type, available options: SQLITE, MYSQL, POSTGRESQL
# Note: data is NOT migrated automatically when you switch the database type :)
storageType: SQLITE

# Encode data fields with Base64
base64EncodeVal: true

# Chunk data loading mode
# Available options:
# - LOAD_WITH_CHUNK: loads Slimefun chunk data when a chunk is loaded for the first time since startup
# - LOAD_ON_STARTUP: loads all chunk data at once on startup, may increase startup time
# LOAD_WITH_CHUNK is recommended by default to save unnecessary memory
# If you notice lag spikes when chunks load, switch to LOAD_ON_STARTUP
dataLoadMode: LOAD_WITH_CHUNK
#########################################################################

#########################################################################
# Database read/write threads
# When using MySQL, it is recommended to set the max connections to read + write threads, with more read threads than write threads.
# Note: more threads is not always better, too many will degrade performance. Please choose a reasonable amount.

# Read threads
readExecutorThread: 10
# Write threads
writeExecutorThread: 5
#########################################################################

#########################################################################
# Delayed writing
# This prevents frequently changing data from flooding the queue with pointless write requests.
# When enabled, changed data waits (delayedSecond) seconds and is only written if there are no further changes.
# A force save adds all waiting data to the write queue immediately.
delayedWriting:
  # Whether to enable delayed writing
  enable: true
  # Delay in seconds
  delayedSecond: 5
  # Force save interval (in seconds)
  forceSavePeriod: 300
#########################################################################

#########################################################################
# Sqlite settings
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL settings
mysql:
  # Database host
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Username
  user: ""
  # Password
  password: ""
  # Whether to use an encrypted connection
  useSSL: false
  # Max connections
  maxConnection: 15
#########################################################################

#########################################################################
# PostgreSQL settings
postgresql:
  # Database host
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Username
  user: ""
  # Password
  password: ""
  # Whether to use an encrypted connection
  useSSL: false
  # Max connections
  maxConnection: 15
#########################################################################