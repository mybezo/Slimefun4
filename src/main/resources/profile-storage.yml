#########################################################################
# Database type, available options: SQLITE, MYSQL, POSTGRESQL
# Note: data is NOT migrated automatically when you switch the database type :)
# Note: when sharing MYSQL across multiple servers, make sure to set allow-open-when-owner-offline
#       to false in config.yml to prevent players from duplicating items by opening the same backpack on different servers.
storageType: SQLITE

# Encode data fields with Base64
base64EncodeVal: true
#########################################################################

#########################################################################
# Database read/write threads
# When using MYSQL, it is recommended that max connections = read + write threads, with more read threads than write threads.
# Note: more threads is not always better, too many will degrade performance. Please choose a reasonable amount.

# Read threads
readExecutorThread: 7
# Write threads
writeExecutorThread: 3
#########################################################################

#########################################################################
# Sqlite settings
sqlite:
  maxConnection: 5
#########################################################################

#########################################################################
# MySQL settings
mysql:
  # Database host
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Username
  user: ""
  # Password
  password: ""
  # Whether to use an encrypted connection
  useSSL: false
  # Max connections
  maxConnection: 10
#########################################################################

#########################################################################
# PostgreSQL settings
postgresql:
  # Database host
  host: "127.0.0.1"
  # Database port
  port: 3306
  # Database name
  database: ""
  # Table prefix
  tablePrefix: ""
  # Username
  user: ""
  # Password
  password: ""
  # Whether to use an encrypted connection
  useSSL: false
  # Max connections
  maxConnection: 10
#########################################################################