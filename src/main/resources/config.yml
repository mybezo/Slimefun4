# options:
#    auto-update - Automatically checks GitHub for new versions and updates
#    armor-update-interval - Update interval of Slimefun armor effects
#    enable-armor-effects - Toggles armor effects
#    chat-prefix - Prefix of all Slimefun chat messages
#    auto-save-delay-in-minutes - Auto-save interval, in minutes
#    legacy-ore-washer - Whether to use the legacy Ore Washer mechanics
#    legacy-dust-washer - Whether to use the legacy Dust Washer mechanics
#    legacy-ore-grinder - Whether to use the legacy Ore Grinder mechanics
#    language - Default language of Slimefun texts (excluding items)
#    enable-translations - Enables multi-language support
#    backwards-compatibility - Item backwards compatibility mode, disabling it makes items use the new item system
#                             which improves performance
#    log-duplicate-block-entries - Whether to log a warning when duplicate block entries are found
#    burn-players-when-radioactive - Whether to burn players exposed to radiation
#    drop-excess-sf-give-items - Whether to drop excess items given via command when the inventory is full
#    backup-data - Automatically back up data
#    bypass-environment-check - Skips the compatibility check (Note: no support will be provided if enabled)
options:
  auto-update: true
  chat-prefix: '&a&lSlimefun 4 &7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: en
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  bypass-environment-check: false
  bypass-item-length-check: false
  max-gps-waypoints: 21

guide:
  # Whether to show vanilla recipes in the guide
  show-vanilla-recipes: true
  # Whether to give players a Slimefun Guide when they join for the first time
  receive-on-first-join: true
  # Whether to show hidden item groups in search results
  show-hidden-item-groups-in-search: false

researches:
  # Whether players in creative mode can unlock researches for free
  free-in-creative-mode: true
  # Whether to launch fireworks when unlocking a research
  enable-fireworks: true
  # Whether to use money instead of XP levels to unlock researches
  use-money-unlock: false
  # Conversion rate from XP levels to money
  currency-cost-convert-rate: 25.0
  # Whether to disable the research unlocking animation
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: false

backpack:
  # Whether a backpack can be opened while its owner is offline
  allow-open-when-owner-offline: true

research-ranks:
  - Chicken
  - Cow
  - Spider
  - Villager
  - Beginner
  - Clumsy Student
  - Unskilled Student
  - Incompetent Student
  - Student
  - Clumsy Apprentice
  - Apprentice
  - Skilled Apprentice
  - Upcoming Mage
  - Excellent Mage
  - Young Magician
  - Incompetent Magician
  - Common Magician
  - Magician
  - Proficient Magician
  - Skilled Magician
  - Accustomed Magician
  - Great Magician
  - Clumsy Wizard
  - Wizard
  - Common Wizard
  - Skilled Wizard
  - Great Wizard
  - Impressive Wizard
  - Young Master
  - Clumsy Master
  - Upcoming Master
  - Competent Master
  - Master
  - Skilled Master
  - Excellent Master
  - Great Master
  - Proficient Master
  - The Chosen One
