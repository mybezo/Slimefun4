# options:
#    auto-update - Automatically check for and install new versions from Github
#    armor-update-interval - Update interval for Slime Technology armor effects
#    enable-armor-effects - Toggle for armor effects
#    chat-prefix - Prefix for all Slime Technology messages
#    auto-save-delay-in-minutes - Interval for auto-saving data, in minutes
#    legacy-ore-washer - Whether to use the legacy Ore Washer mechanic
#    legacy-dust-washer - Whether to use the legacy Dust Washer mechanic
#    legacy-ore-grinder - Whether to use the legacy Ore Grinder mechanic
#    language - Slime Technology text language (does not include items)
#    enable-translations - Multi-language feature
#    backwards-compatibility - Item backwards-compatibility mode, when disabled items will use the new item system
#                             which will improve performance
#    log-duplicate-block-entries - Whether to output warnings when duplicate blocks are found
#    burn-players-when-radioactive - Whether to burn players when they are exposed to radiation
#    drop-excess-sf-give-items - Whether to drop excess Slimefun items directly when giving items via command to a full inventory
#    backup-data - Automatically back up data
#    bypass-environment-check - Skip the compatibility check (Note: issue reports will not be accepted once enabled)
options:
  auto-update: true
  chat-prefix: '&a&lSlimefun 4 &7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: zh-CN
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  bypass-environment-check: false
  bypass-item-length-check: false
  max-gps-waypoints: 21

guide:
  # Whether to show vanilla item crafting recipes in the guide
  show-vanilla-recipes: true
  # Whether to automatically give the Slime Technology guide to players the first time they join the server
  receive-on-first-join: true
  # Whether to show hidden items in search results
  show-hidden-item-groups-in-search: false

researches:
  # Whether to allow creative-mode players to unlock research for free
  free-in-creative-mode: true
  # Whether to launch fireworks when unlocking research
  enable-fireworks: true
  # Whether to use in-game currency instead of experience to unlock research
  use-money-unlock: false
  # Experience to in-game currency auto-conversion rate
  currency-cost-convert-rate: 25.0
  # Whether to disable the animation when unlocking research
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: false

backpack:
  # Whether to allow a backpack to be opened while its owner is offline
  allow-open-when-owner-offline: true

research-ranks:
  - Chick
  - Mr. Moo
  - Spider
  - Villager
  - Pioneer
  - Novice
  - Intern
  - Failed Student
  - Student
  - Clumsy Apprentice
  - Apprentice
  - Skilled Apprentice
  - Mage Apprentice
  - Outstanding Mage
  - Young Magician
  - Clumsy Magician
  - Ordinary Magician
  - Magician
  - Skilled Magician
  - Trick Magician
  - Seasoned Magician
  - Outstanding Magician
  - Clumsy Wizard
  - Wizard
  - Ordinary Wizard 
  - Trick Wizard
  - Outstanding Wizard
  - Exceptional Wizard
  - Young Master
  - Clumsy Master
  - Intern Master
  - Qualified Master
  - Master
  - Trick Master
  - Outstanding Master
  - Exceptional Master
  - Grandmaster
  - Chosen One
